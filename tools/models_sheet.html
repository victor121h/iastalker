<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Morada — folha de modelos</title>
<style>
  html, body { margin: 0; background: #2a3a4a; font-family: system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  .lbl { position: absolute; color: #fff; background: rgba(20,40,55,.8); padding: 1px 6px; border-radius: 6px; font-size: 12px; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../js/util.js"></script>
<script src="../js/data.js"></script>
<script src="render_datastub.js"></script>
<script src="../js/models.js"></script>
<script>
// Contact sheet: each cell renders ONE model (or one character animation) with its own camera.
// URL: ?set=objects|anims|variants&page=N&cols=5&rows=3&t=1.3&yaw=0.785
(function () {
  const q = new URLSearchParams(location.search);
  const set = q.get('set') || 'objects';
  const page = +(q.get('page') || 0);
  const cols = +(q.get('cols') || 5), rows = +(q.get('rows') || 3);
  const T = +(q.get('t') || 1.3);
  const yaw = q.has('yaw') ? +q.get('yaw') : Math.PI / 4;
  const pitch = q.has('pitch') ? +q.get('pitch') : 0.6;
  const W = window.innerWidth, H = window.innerHeight;
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(1);
  renderer.setSize(W, H);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.12;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setScissorTest(true);
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(new THREE.Color('#ffffff').convertSRGBToLinear(), new THREE.Color('#857659').convertSRGBToLinear(), 0.82));
  const sun = new THREE.DirectionalLight(new THREE.Color('#fff7ea').convertSRGBToLinear(), 1.15);
  sun.position.set(4, 8, 6); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
  const sc = sun.shadow.camera; sc.left = -3; sc.right = 3; sc.top = 3; sc.bottom = -3; sc.near = 0.5; sc.far = 30;
  sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02;
  scene.add(sun); scene.add(sun.target);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.MeshStandardMaterial({ color: new THREE.Color('#d9d2c3').convertSRGBToLinear(), roughness: 0.95 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  const grid = new THREE.GridHelper(12, 12, 0xa89f8f, 0xbdb5a5); grid.position.y = 0.002; scene.add(grid);
  const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
  const cat = M.data.CATALOG;
  let items = [];
  if (set === 'objects') {
    items = Object.keys(cat).map(function (t) { return { label: t, type: t, opts: { servings: 4 } }; });
    items.push({ label: 'spoiled_meal', type: 'spoiled_meal', opts: {} });
  } else if (set === 'variants') {
    items = [
      { label: 'bed_double (desarrumada)', type: 'bed_double', opts: { unmade: true } }, { label: 'bed_single (desarrumada)', type: 'bed_single', opts: { unmade: true } },
      { label: 'plant_small (morta)', type: 'plant_small', opts: { dead: true } }, { label: 'plant_small (com sede)', type: 'plant_small', opts: { wilting: true } },
      { label: 'plant_big (morta)', type: 'plant_big', opts: { dead: true } }, { label: 'meal x1', type: 'meal', opts: { servings: 1 } },
      { label: 'meal x2 estragada', type: 'meal', opts: { servings: 2, spoiled: true } }, { label: 'dirty_plate estragado', type: 'dirty_plate', opts: { spoiled: true } },
      { label: 'puddle v1', type: 'puddle', opts: { variant: 1 } }, { label: 'puddle v2', type: 'puddle', opts: { variant: 2 } },
      { label: 'env_tree', type: 'env_tree', opts: { variant: 1 } }, { label: 'env_pine', type: 'env_pine', opts: { variant: 2 } },
      { label: 'env_bush', type: 'env_bush', opts: { variant: 3 } }, { label: 'env_streetlamp', type: 'env_streetlamp', opts: {} }, { label: 'unknown_thing', type: 'unknown_thing', opts: { w: 2, h: 1 } },
      { label: 'pizza x4', type: 'meal', opts: { food: 'pizza', servings: 4 } }, { label: 'pizza x1', type: 'meal', opts: { food: 'pizza', servings: 1 } },
      { label: 'meal queimada', type: 'meal', opts: { servings: 3, burnt: true } }, { label: 'easel p0', type: 'easel', opts: { progress: 0 } },
      { label: 'easel p2', type: 'easel', opts: { progress: 2 } },
      { label: 'car sedan', type: 'carpool', opts: { car: 'sedan' } }, { label: 'car van', type: 'carpool', opts: { car: 'van' } },
      { label: 'car executive', type: 'carpool', opts: { car: 'executive' } }, { label: 'car limo', type: 'carpool', opts: { car: 'limo' } },
      { label: 'car police', type: 'carpool', opts: { car: 'police' } },
    ];
  } else {
    const A = ['idle', 'walk', 'sit', 'sleep', 'eat', 'cook', 'shower', 'bath', 'toilet', 'wash', 'read', 'tv', 'computer', 'talk', 'dance',
      'exercise', 'paint', 'chess', 'clean', 'phone', 'piano', 'cry', 'wave', 'joke', 'hug', 'kiss', 'angry', 'laugh', 'stretch', 'use',
      'tv:sofa_cheap', 'eat:chair_dining', 'read:armchair', 'sleep:sofa_cheap', 'sleep:armchair', 'bath:hot_tub', 'sleep:floor', 'talk:chair_wood',
      'sleep:bed_double', 'sit:sofa_lux', 'toilet:toilet_lux', 'idle:chair_dining', 'phone:armchair', 'walk:m', 'idle:m'];
    const SUP = { sit: 'chair_wood', sleep: 'bed_single', toilet: 'toilet', shower: 'shower', bath: 'bathtub', exercise: 'exercise',
      computer: 'computer', piano: 'piano', chess: 'chess', cook: 'stove', wash: 'sink', paint: 'easel', phone: 'phone', use: 'arcade', clean: 'counter', tv: 'tv_cheap' };
    items = A.map(function (a, i) {
      const p = a.split(':');
      let sup = p[1] || SUP[p[0]] || null;
      let gender = i % 2 ? 'm' : 'f';
      if (p[1] === 'm') { sup = null; gender = 'm'; }
      if (p[1] === 'floor') sup = null;
      return { label: a, anim: p[0], sup: sup, gender: gender, i: i };
    });
  }
  const per = cols * rows;
  const pageItems = items.slice(page * per, page * per + per);
  const cw = Math.floor(W / cols), ch = Math.floor(H / rows);
  const pal = M.data.PALETTES || {};
  const pick = function (arr, k) { return arr && arr.length ? arr[k % arr.length] : null; };
  const onAnims = { sit: 1, sleep: 1, toilet: 1, shower: 1, bath: 1, exercise: 1 };
  pageItems.forEach(function (it, idx) {
    const cx = (idx % cols) * cw, cy = Math.floor(idx / cols) * ch;
    const holder = new THREE.Group(); scene.add(holder);
    let center = new THREE.Vector3(0.5, 0.5, 0.5), radius = 1.2;
    if (set !== 'anims') {
      const def = cat[it.type];
      const key = (def && def.model) || it.type;
      const g = M.models.build(key, it.opts);
      const w = (def && def.w) || it.opts.w || 1, h = (def && def.h) || it.opts.h || 1;
      if (/^env_/.test(key)) { g.position.set(0, 0, 0); } else g.position.set(-w / 2, 0, -h / 2);
      holder.add(g);
      if (def && def.wall) {
        const wl = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.6, 0.1), new THREE.MeshStandardMaterial({ color: new THREE.Color('#efe2c4').convertSRGBToLinear() }));
        wl.position.set(0, 1.3, -h / 2); wl.castShadow = wl.receiveShadow = true; holder.add(wl);
      }
      const box = new THREE.Box3().setFromObject(holder);
      box.getCenter(center); radius = Math.max(0.5, box.getSize(new THREE.Vector3()).length() / 2);
    } else {
      let sx = 0, sz = 0, facing = 0, seated = false, supMeta = null, off = null;
      if (it.sup) {
        const d = cat[it.sup];
        const g = M.models.build((d && d.model) || it.sup, {});
        const w = (d && d.w) || 1, h = (d && d.h) || 1;
        g.position.set(-0.5, 0, -0.5);
        holder.add(g);
        const meta = M.models.meta((d && d.model) || it.sup);
        if (onAnims[it.anim] || (it.label.indexOf(':') > 0 && meta.support)) {
          // stand ON the object: slot 0
          const slot = (d && d.slots && d.slots[0]) || { dx: 0, dy: 0, facing: 0 };
          sx = -0.5 + slot.dx + 0.5 + (slot.ox || 0); sz = -0.5 + slot.dy + 0.5 + (slot.oy || 0);
          facing = slot.facing || 0; seated = true; supMeta = meta;
          const ocx = -0.5 + w / 2, ocz = -0.5 + h / 2;
          const dx = ocx - sx, dz = ocz - sz, c = Math.cos(facing), s = Math.sin(facing);
          off = { x: dx * c - dz * s, z: dx * s + dz * c };
        } else {
          const slot = (d && d.slots && d.slots[0]) || { dx: 0, dy: h, facing: Math.PI };
          sx = -0.5 + slot.dx + 0.5 + (slot.ox || 0); sz = -0.5 + slot.dy + 0.5 + (slot.oy || 0); facing = slot.facing;
        }
      }
      const sim = { id: 'a' + it.i, name: 'Ator ' + it.i, gender: it.gender, colors: { skin: pick(pal.skin, it.i * 3 + 1) || '#e2b48e', hair: pick(pal.hair, it.i * 5 + 2) || '#3b2a20', shirt: pick(pal.shirt, it.i * 7 + 3) || '#4f80bf', pants: pick(pal.pants, it.i * 11 + 4) || '#3d4a5c' } };
      const rig = M.models.character(sim);
      rig.root.position.set(sx, 0, sz); rig.root.rotation.y = facing;
      if (supMeta && supMeta.support === 'bed') rig.setBlanket(supMeta.blanket);
      holder.add(rig.root);
      const ctx = { seated: seated, support: supMeta ? supMeta.support : null, seatH: supMeta ? supMeta.seatH : undefined, off: off, phase: T * 7 };
      M.models.animate(rig, it.anim, T, ctx);
      M.models.animate(rig, it.anim, T + 0.5, ctx);    // settle the transition blend
      for (let k = 0; k < 10; k++) M.models.animate(rig, it.anim, T + 0.6 + k * 0.05, ctx);
      const box = new THREE.Box3().setFromObject(holder);
      box.getCenter(center); radius = Math.max(0.9, box.getSize(new THREE.Vector3()).length() / 2);
    }
    holder.updateMatrixWorld(true);
    const dist = radius / Math.sin(15 * Math.PI / 180) * 1.05;
    cam.aspect = cw / ch; cam.updateProjectionMatrix();
    cam.position.set(center.x + dist * Math.cos(pitch) * Math.sin(yaw), center.y + dist * Math.sin(pitch), center.z + dist * Math.cos(pitch) * Math.cos(yaw));
    cam.lookAt(center);
    sun.target.position.copy(center);
    renderer.setViewport(cx, H - cy - ch, cw, ch);
    renderer.setScissor(cx, H - cy - ch, cw, ch);
    renderer.setClearColor(idx % 2 ? 0xbcd3e4 : 0xc7dbe9, 1);
    renderer.clear();
    renderer.render(scene, cam);
    scene.remove(holder);
    const l = document.createElement('div'); l.className = 'lbl'; l.textContent = it.label; l.style.left = (cx + 6) + 'px'; l.style.top = (cy + 6) + 'px';
    document.body.appendChild(l);
  });
  window.__sheet = { total: items.length, pages: Math.ceil(items.length / per) };
})();
</script>
</body>
</html>
