<meta charset="utf-8">
<title>Morada</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: the 3D lot runs edge to edge; the HUD floats over it in translucent teal-navy panels —
   needs dock bottom-left, controls bar along the bottom, catalog drawer on the right (bottom sheets on phones). */
:root {
  color-scheme: dark;
  --bg: #0a1b23;
  --panel: rgba(11, 34, 44, 0.88);
  --panel-solid: #0e2b37;
  --panel-raised: rgba(25, 61, 74, 0.94);
  --panel-hover: rgba(39, 84, 99, 0.95);
  --line: rgba(158, 212, 219, 0.16);
  --line-strong: rgba(158, 212, 219, 0.34);
  --ink: #edf4ef;
  --ink-dim: #a6c0c4;
  --ink-faint: #6c8e95;
  --accent: #f7c548;
  --accent-deep: #dfa21f;
  --accent-ink: #2b1e02;
  --good: #64cf74;
  --warn: #f2b33d;
  --bad: #e65a43;
  --info: #67c1dd;
  --career: #b896f4;
  --money: #f7c548;
  --scrim: rgba(4, 14, 19, 0.62);
  --shadow: 0 12px 32px rgba(2, 10, 14, 0.45);
  --shadow-sm: 0 4px 14px rgba(2, 10, 14, 0.35);
  --r-lg: 18px;
  --r-md: 12px;
  --r-sm: 8px;
  --font-display: 'Baloo 2', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Nunito Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --gap: 12px;
  --bar-h: 64px;
  --drawer-w: 352px;
  --sab: env(safe-area-inset-bottom, 0px);
  --sat: env(safe-area-inset-top, 0px);
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 14px; line-height: 1.35;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
#app { position: relative; height: 100%; width: 100%; overflow: hidden; }
#view { position: fixed; inset: 0; background: radial-gradient(120% 90% at 50% 35%, #173a46 0%, var(--bg) 70%); touch-action: none; }
#view canvas { display: block; width: 100%; height: 100%; outline: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------------------------------------------------------------- HUD shell */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#hud > * { pointer-events: auto; }
#hud > .layer { pointer-events: none; }
.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg);
  box-shadow: var(--shadow); -webkit-backdrop-filter: blur(10px) saturate(1.2); backdrop-filter: blur(10px) saturate(1.2);
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 34px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--panel-raised); color: var(--ink); font-weight: 700; font-size: 13px;
  transition: background .15s, border-color .15s, transform .1s;
}
.btn:hover { background: var(--panel-hover); border-color: var(--line-strong); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: #ffd462; }
.btn.danger { background: rgba(230, 90, 67, .18); border-color: rgba(230, 90, 67, .6); color: #ffd2c9; }
.btn.danger:hover { background: rgba(230, 90, 67, .32); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 28px; padding: 3px 10px; font-size: 12px; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-raised);
  display: inline-grid; place-items: center; font-size: 16px; line-height: 1; padding: 0;
  transition: background .15s, border-color .15s;
}
.icon-btn:hover { background: var(--panel-hover); border-color: var(--line-strong); }
.icon-btn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.kbd { font-family: var(--font-body); font-size: 11px; font-weight: 800; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line-strong); color: var(--ink-dim); background: rgba(0,0,0,.18); }
.muted { color: var(--ink-dim); }
.faint { color: var(--ink-faint); }
.num { font-variant-numeric: tabular-nums; }
.emoji { font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif; line-height: 1; }

/* -------------------------------------------------------------- bottom bar */
#bar {
  position: fixed; left: var(--gap); right: var(--gap); bottom: calc(var(--gap) + var(--sab));
  min-height: var(--bar-h); display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 8px 10px 8px 8px;
}
.modes { display: flex; gap: 4px; background: rgba(0,0,0,.22); padding: 4px; border-radius: 14px; }
.mode-btn {
  display: flex; align-items: center; gap: 7px; height: 42px; padding: 0 14px; border-radius: 11px; border: 0;
  background: transparent; color: var(--ink-dim); font-family: var(--font-display); font-weight: 700; font-size: 16px;
  transition: background .15s, color .15s;
}
.mode-btn .emoji { font-size: 18px; }
.mode-btn:hover { color: var(--ink); background: rgba(255,255,255,.06); }
.mode-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.timebox { display: flex; align-items: center; gap: 14px; }
.clock { display: flex; align-items: center; gap: 10px; }
.clock-face {
  position: relative; width: 40px; height: 40px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 50% 40%, #224c5a, #102f3a); border: 2px solid var(--line-strong);
}
.clock-face::after { content: ''; position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px; border-radius: 50%; background: var(--accent); }
.clock-face .hand { position: absolute; left: 50%; bottom: 50%; transform-origin: 50% 100%; border-radius: 2px; background: var(--ink); }
.clock-face .hand.h { width: 3px; height: 11px; margin-left: -1.5px; }
.clock-face .hand.m { width: 2px; height: 15px; margin-left: -1px; background: var(--accent); }
.clock-face.night { background: radial-gradient(circle at 50% 40%, #1b2a4a, #0d1830); }
.clock-text { display: flex; flex-direction: column; line-height: 1.05; }
.clock-time { font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: .5px; font-variant-numeric: tabular-nums; }
.clock-day { font-size: 12px; color: var(--ink-dim); font-weight: 700; white-space: nowrap; }
.speeds { display: flex; gap: 4px; background: rgba(0,0,0,.22); padding: 4px; border-radius: 14px; position: relative; }
.speed-btn {
  width: 38px; height: 36px; border-radius: 10px; border: 0; background: transparent; color: var(--ink-dim);
  display: grid; place-items: center; padding: 0;
}
.speed-btn svg { width: 18px; height: 18px; fill: currentColor; }
.speed-btn:hover { color: var(--ink); background: rgba(255,255,255,.07); }
.speed-btn[aria-pressed="true"] { background: var(--ink); color: var(--panel-solid); }
.speed-btn[aria-pressed="true"].pause { background: var(--bad); color: #fff; }
.speed-note {
  position: absolute; left: 50%; top: -26px; transform: translateX(-50%); white-space: nowrap;
  font-size: 11px; font-weight: 800; letter-spacing: .4px; text-transform: uppercase;
  padding: 2px 9px; border-radius: 999px; background: var(--panel-solid); border: 1px solid var(--line-strong); color: var(--accent);
}
.moneybox { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.05; position: relative; min-width: 128px; }
.money-family { font-size: 12px; color: var(--ink-dim); font-weight: 700; max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.moneybox .money { font-family: var(--font-display); font-weight: 800; font-size: 24px; color: var(--money); font-variant-numeric: tabular-nums; white-space: nowrap; }
.moneybox .money.low { color: var(--bad); }
.money-float {
  position: absolute; right: 0; bottom: 100%; font-family: var(--font-display); font-weight: 800; font-size: 18px;
  white-space: nowrap; pointer-events: none; animation: floatUp 1.6s ease-out forwards; text-shadow: 0 2px 6px rgba(0,0,0,.5);
}
.money-float.pos { color: var(--good); }
.money-float.neg { color: var(--bad); }
@keyframes floatUp { 0% { opacity: 0; transform: translateY(6px); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(-34px); } }
.save-chip { font-size: 11px; font-weight: 700; color: var(--ink-faint); white-space: nowrap; min-height: 14px; }

/* ------------------------------------------------------------- live dock */
#dock { position: fixed; left: var(--gap); bottom: calc(var(--gap) * 2 + var(--bar-h) + var(--sab)); width: 372px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
#dock > * { pointer-events: auto; }
.portraits { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.portrait {
  position: relative; width: 54px; height: 54px; border-radius: 50%; padding: 0; border: 3px solid var(--line-strong);
  background: var(--panel-solid); box-shadow: var(--shadow-sm); transition: transform .15s, border-color .15s;
}
.portrait canvas { width: 100%; height: 100%; border-radius: 50%; display: block; }
.portrait:hover { transform: translateY(-2px); }
.portrait[aria-pressed="true"] { border-color: var(--accent); transform: translateY(-3px); }
.portrait .badge { position: absolute; right: -6px; top: -6px; font-size: 14px; background: var(--panel-solid); border: 1px solid var(--line-strong); border-radius: 999px; width: 22px; height: 22px; display: grid; place-items: center; }
.portrait .mood-dot { position: absolute; left: 50%; bottom: -5px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; border: 2px solid var(--panel-solid); }
.portrait.away canvas { filter: grayscale(.7) brightness(.75); }
.portrait-name { position: absolute; left: 50%; top: calc(100% + 6px); transform: translateX(-50%); font-size: 11px; font-weight: 800; white-space: nowrap; text-shadow: 0 1px 3px rgba(0,0,0,.8); pointer-events: none; opacity: 0; transition: opacity .15s; }
.portrait:hover .portrait-name, .portrait:focus-visible .portrait-name { opacity: 1; }
.queue { display: flex; gap: 6px; align-items: center; min-height: 44px; }
.queue-label { font-size: 11px; font-weight: 800; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .6px; margin-right: 2px; }
.q-item {
  position: relative; width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line-strong); padding: 0;
  background: var(--panel); display: grid; place-items: center; font-size: 20px; box-shadow: var(--shadow-sm);
}
.q-item.current { border-color: var(--accent); background: var(--panel-raised); }
.q-item.auto { opacity: .62; border-style: dashed; }
.q-item.walking::after { content: '🚶'; position: absolute; right: -5px; bottom: -5px; font-size: 12px; background: var(--panel-solid); border-radius: 50%; width: 18px; height: 18px; display: grid; place-items: center; }
.q-item.cancel { opacity: .4; }
.q-item.cancel::before { content: ''; position: absolute; inset: 7px; background: linear-gradient(45deg, transparent 45%, var(--bad) 45%, var(--bad) 55%, transparent 55%); }
.q-item:hover { border-color: var(--bad); }
.q-item .q-prog { position: absolute; left: 4px; right: 4px; bottom: 3px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.12); overflow: hidden; }
.q-item .q-prog i { display: block; height: 100%; background: var(--accent); }
.queue-empty { font-size: 12px; color: var(--ink-faint); font-weight: 700; }

.needs { padding: 12px 14px 14px; }
.needs-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.needs-name { font-family: var(--font-display); font-weight: 800; font-size: 19px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.needs-sub { font-size: 12px; color: var(--ink-dim); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mood { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex: none; }
.mood-label { font-size: 11px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; }
.mood-meter { display: flex; gap: 2px; }
.mood-meter i { width: 9px; height: 12px; border-radius: 3px; background: rgba(255,255,255,.1); }
.mood-meter i.neg.on { background: var(--bad); }
.mood-meter i.pos.on { background: var(--good); }
.mood-meter i.mid { width: 2px; background: var(--line-strong); }
.tabs { display: flex; gap: 2px; background: rgba(0,0,0,.2); border-radius: 11px; padding: 3px; margin-bottom: 10px; }
.tab {
  flex: 0 0 auto; min-width: 40px; height: 30px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-dim);
  font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 4px; padding: 0 4px; white-space: nowrap;
}
.tab .t-label { overflow: hidden; text-overflow: ellipsis; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--panel-hover); color: var(--ink); flex: 1 1 auto; padding: 0 10px; }
.tab:not([aria-selected="true"]) .t-label { display: none; }
.tab .emoji { font-size: 15px; }
.tab-body { height: 176px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
.need-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
.need { display: grid; grid-template-columns: 20px 1fr; align-items: center; column-gap: 6px; row-gap: 3px; }
.need .n-ico { grid-row: span 2; font-size: 16px; text-align: center; }
.need .n-label { font-size: 12px; font-weight: 700; color: var(--ink-dim); display: flex; justify-content: space-between; gap: 4px; }
.need .n-label b { color: var(--ink); font-weight: 800; font-variant-numeric: tabular-nums; font-size: 11px; opacity: .75; }
.bar { position: relative; height: 9px; border-radius: 6px; background: rgba(0,0,0,.35); overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,.4); }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; transition: width .35s ease, background-color .35s; }
.bar.center::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.25); z-index: 1; }
.bar.center > i { left: auto; }
.need.crit .bar { animation: critPulse 1.1s ease-in-out infinite; }
@keyframes critPulse { 0%, 100% { box-shadow: inset 0 1px 2px rgba(0,0,0,.4); } 50% { box-shadow: 0 0 0 2px rgba(230, 90, 67, .55); } }
.need .n-trend { font-size: 10px; }
.skill-row, .trait-row { display: grid; grid-template-columns: 22px 98px 1fr 34px; align-items: center; gap: 6px; padding: 4px 0; }
.skill-row .s-ico { font-size: 15px; text-align: center; }
.skill-row .s-label, .trait-row .s-label { font-size: 12px; font-weight: 700; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pips { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
.pips i { position: relative; height: 10px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
.pips i b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }
.pips.trait i b { background: var(--info); }
.skill-row .s-val, .trait-row .s-val { font-size: 12px; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
.trait-row { grid-template-columns: 1fr; gap: 3px; padding: 5px 0; }
.trait-ends { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: var(--ink-faint); }
.trait-ends b { color: var(--ink); }
.career-card { display: grid; gap: 8px; }
.career-top { display: flex; gap: 10px; align-items: center; }
.career-ico { font-size: 26px; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: rgba(184, 150, 244, .16); border: 1px solid rgba(184, 150, 244, .4); }
.career-title { font-family: var(--font-display); font-weight: 800; font-size: 16px; line-height: 1.1; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12px; }
.kv dt { color: var(--ink-faint); font-weight: 700; }
.kv dd { margin: 0; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.req-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 12px; }
.req-list li { display: flex; justify-content: space-between; gap: 8px; }
.req-list li.ok { color: var(--good); }
.req-list li.no { color: var(--ink-dim); }
.section-label { font-size: 11px; font-weight: 800; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .6px; margin-top: 4px; }
.rel-row { display: grid; grid-template-columns: 36px 1fr; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); }
.rel-row:last-child { border-bottom: 0; }
.rel-row canvas { width: 36px; height: 36px; border-radius: 50%; display: block; }
.rel-name { font-size: 13px; font-weight: 800; display: flex; gap: 6px; align-items: center; min-width: 0; }
.rel-name span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rel-tag { font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 999px; background: rgba(255,255,255,.08); color: var(--ink-dim); flex: none; }
.rel-tag.friend { background: rgba(247, 197, 72, .18); color: var(--accent); }
.rel-bars { display: grid; grid-template-columns: 52px 1fr 30px; gap: 2px 6px; align-items: center; font-size: 10px; color: var(--ink-faint); font-weight: 700; margin-top: 3px; }
.rel-bars .bar { height: 7px; }
.rel-bars b { text-align: right; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.empty-note { font-size: 12px; color: var(--ink-dim); padding: 6px 0; }
#needs-toggle { display: none; }
#dock .portraits { order: 1; }
#dock .queue { order: 2; }
#dock #needs-panel { order: 3; }

/* --------------------------------------------------------- camera cluster */
#cam { position: fixed; left: var(--gap); top: calc(var(--gap) + var(--sat)); display: flex; gap: 6px; padding: 6px; border-radius: 16px; align-items: center; }
#cam .sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 2px; }
.wall-btn { height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-raised); padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; white-space: nowrap; }
.wall-btn:hover { background: var(--panel-hover); }
.wall-btn svg { width: 18px; height: 18px; }

/* --------------------------------------------------------- toasts + log */
#toasts { position: fixed; right: var(--gap); top: calc(var(--gap) + 48px + var(--sat)); width: min(340px, calc(100vw - 2 * var(--gap))); display: flex; flex-direction: column; gap: 8px; pointer-events: none; transition: right .25s; }
#hud.drawer-open #toasts { right: calc(var(--drawer-w) + var(--gap) * 2); }
#hud.log-open #toasts { visibility: hidden; }
.toast {
  pointer-events: auto; display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: start;
  padding: 10px 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line);
  border-left: 4px solid var(--info); box-shadow: var(--shadow); font-size: 13px; font-weight: 600;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); animation: toastIn .28s ease-out;
}
.toast .t-ico { font-size: 18px; line-height: 1.1; }
.toast .t-close { border: 0; background: transparent; color: var(--ink-faint); font-size: 16px; line-height: 1; padding: 2px 4px; border-radius: 6px; }
.toast .t-close:hover { color: var(--ink); }
.toast .t-actions { grid-column: 2 / 4; display: flex; gap: 6px; margin-top: 2px; }
.toast.good { border-left-color: var(--good); }
.toast.bad { border-left-color: var(--bad); }
.toast.career { border-left-color: var(--career); }
.toast.money { border-left-color: var(--money); }
.toast.leaving { animation: toastOut .3s ease-in forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateX(16px); } }
#log-btn { position: fixed; right: var(--gap); top: calc(var(--gap) + var(--sat)); transition: right .25s; z-index: 2; }
#hud.drawer-open #log-btn { right: calc(var(--drawer-w) + var(--gap) * 2); }
#log-btn .count { position: absolute; right: -4px; top: -4px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 800; display: grid; place-items: center; }
#log-panel { position: fixed; right: var(--gap); top: calc(var(--gap) + 50px + var(--sat)); width: min(360px, calc(100vw - 2 * var(--gap))); max-height: min(60vh, 460px); display: flex; flex-direction: column; z-index: 3; }
#hud.drawer-open #log-panel { right: calc(var(--drawer-w) + var(--gap) * 2); }
.log-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 8px; }
.log-head h2 { margin: 0; font-family: var(--font-display); font-size: 18px; }
.log-list { list-style: none; margin: 0; padding: 0 14px 12px; overflow-y: auto; display: grid; gap: 6px; }
.log-list li { display: grid; grid-template-columns: 22px 1fr; gap: 6px; font-size: 12.5px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.log-list li:last-child { border-bottom: 0; }
.log-list time { display: block; font-size: 11px; color: var(--ink-faint); font-weight: 700; }

/* ------------------------------------------------------------- drawer */
#drawer {
  position: fixed; right: var(--gap); top: calc(var(--gap) + var(--sat)); bottom: calc(var(--gap) * 2 + var(--bar-h) + var(--sab));
  width: var(--drawer-w); display: flex; flex-direction: column; overflow: hidden;
}
.drawer-head { padding: 12px 14px 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.drawer-head h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 21px; line-height: 1; }
.paused-pill { font-size: 11px; font-weight: 800; letter-spacing: .4px; text-transform: uppercase; color: var(--accent); border: 1px solid rgba(247, 197, 72, .45); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.drawer-grip { display: none; }
#drawer > .drawer-head, #drawer > .cats, #drawer > .tools, #drawer > .detail, #drawer > .drawer-grip { flex: none; }
.cats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding: 0 12px 10px; }
.cat-btn { height: 46px; border-radius: 11px; border: 1px solid var(--line); background: rgba(0,0,0,.18); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 2px; color: var(--ink-dim); }
.cat-btn .emoji { font-size: 17px; }
.cat-btn .c-label { font-size: 9.5px; font-weight: 800; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cat-btn:hover { color: var(--ink); background: rgba(255,255,255,.05); }
.cat-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.catalog { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 2px 12px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; overscroll-behavior: contain; scrollbar-width: thin; }
.card {
  display: flex; flex-direction: column; text-align: left; gap: 4px; padding: 8px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--panel-raised); min-width: 0; transition: border-color .15s, transform .12s, background .15s;
}
.card:hover { border-color: var(--line-strong); background: var(--panel-hover); }
.card[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(247, 197, 72, .35) inset; }
.card.poor { opacity: .55; }
.card-thumb { height: 72px; border-radius: 10px; display: grid; place-items: center; font-size: 34px; background: radial-gradient(circle at 50% 35%, rgba(255,255,255,.1), rgba(0,0,0,.18)); overflow: hidden; }
.card-thumb img { width: 100%; height: 100%; object-fit: contain; }
.card-name { font-size: 12.5px; font-weight: 800; line-height: 1.2; min-height: 2.4em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-price { font-family: var(--font-display); font-weight: 800; font-size: 15px; color: var(--money); font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 3px; }
.chip { font-size: 10.5px; font-weight: 800; padding: 1px 5px; border-radius: 6px; background: rgba(0,0,0,.25); color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.skill { background: rgba(103, 193, 221, .18); }
.detail { border-top: 1px solid var(--line); padding: 10px 14px 12px; font-size: 12.5px; min-height: 70px; }
.detail h3 { margin: 0 0 3px; font-family: var(--font-display); font-size: 16px; line-height: 1.15; }
.detail p { margin: 0 0 6px; color: var(--ink-dim); }
.detail .d-meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11.5px; font-weight: 700; color: var(--ink-faint); }
.tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 0 12px 10px; }
.tool-btn { height: 54px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0,0,0,.18); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--ink-dim); font-size: 11.5px; font-weight: 800; }
.tool-btn .emoji { font-size: 19px; }
.tool-btn .t-short { display: none; }
.tool-btn:hover { color: var(--ink); background: rgba(255,255,255,.05); }
.tool-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tool-opts { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 12px 12px; display: flex; flex-direction: column; gap: 10px; scrollbar-width: thin; }
.tool-help { font-size: 12.5px; color: var(--ink-dim); background: rgba(0,0,0,.18); border-radius: 12px; padding: 10px 12px; }
.tool-help b { color: var(--ink); }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.swatch { display: flex; flex-direction: column; gap: 4px; padding: 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-raised); text-align: left; min-width: 0; }
.swatch:hover { border-color: var(--line-strong); }
.swatch[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(247, 197, 72, .35) inset; }
.swatch i { display: block; height: 30px; border-radius: 8px; border: 1px solid rgba(0,0,0,.25); }
.swatch .sw-name { font-size: 11px; font-weight: 800; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.swatch .sw-price { font-size: 11px; font-weight: 800; color: var(--money); }

/* ------------------------------------------------------- floating tools */
#toolbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--gap) * 2 + var(--bar-h) + var(--sab)); display: flex; gap: 6px; align-items: center; padding: 6px 8px; border-radius: 16px; max-width: calc(100vw - 2 * var(--gap)); flex-wrap: wrap; justify-content: center; }
#hud.drawer-open #toolbar { left: calc((100vw - var(--drawer-w) - var(--gap)) / 2); }
#toolbar .tb-title { font-family: var(--font-display); font-weight: 800; font-size: 15px; padding: 0 6px; white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
#toolbar .tb-note { font-size: 12px; color: var(--ink-dim); font-weight: 700; padding: 0 4px; }
#tip {
  position: fixed; left: 0; top: 0; z-index: 40; pointer-events: none; padding: 5px 9px; border-radius: 9px; background: var(--panel-solid);
  border: 1px solid var(--line-strong); font-size: 12px; font-weight: 800; white-space: nowrap; box-shadow: var(--shadow-sm); transform: translate(14px, 14px);
}
#tip.bad { border-color: rgba(230, 90, 67, .7); color: #ffcabe; }
#tip .money-pos { color: var(--good); }
#tip .money-neg { color: var(--money); }
#hover-label { position: fixed; left: 0; top: 0; z-index: 0; pointer-events: none; padding: 3px 9px; border-radius: 999px; background: rgba(7, 24, 31, .82); font-size: 12px; font-weight: 800; white-space: nowrap; transform: translate(-50%, -150%); }

/* ------------------------------------------------------------ bubbles */
#bubbles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.bubble {
  position: absolute; left: 0; top: 0; min-width: 44px; height: 44px; padding: 0 8px; display: grid; place-items: center;
  font-size: 24px; background: #fdfbf3; color: #1b2a30; border-radius: 22px; box-shadow: 0 6px 16px rgba(0,0,0,.35);
  transform: translate(-50%, calc(-100% - 14px)); will-change: transform;
}
.bubble.talk::after { content: ''; position: absolute; left: 50%; bottom: -8px; margin-left: -8px; border: 8px solid transparent; border-top-color: #fdfbf3; border-bottom: 0; }
.bubble.think { border-radius: 50%; width: 46px; padding: 0; }
.bubble.think::before, .bubble.think::after { content: ''; position: absolute; background: #fdfbf3; border-radius: 50%; box-shadow: 0 3px 6px rgba(0,0,0,.25); }
.bubble.think::before { width: 11px; height: 11px; left: 14px; bottom: -10px; }
.bubble.think::after { width: 6px; height: 6px; left: 9px; bottom: -17px; }
.bubble.pop { animation: bubblePop .25s ease-out; }
@keyframes bubblePop { from { scale: .4; opacity: 0; } to { scale: 1; opacity: 1; } }
.walk-ping { position: fixed; z-index: 4; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; border: 3px solid var(--accent); pointer-events: none; animation: ping .6s ease-out forwards; }
@keyframes ping { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.3); opacity: 0; } }

/* ------------------------------------------------------------ pie menu */
#pie { position: fixed; inset: 0; z-index: 30; pointer-events: auto; outline: none; }
#pie .pie-scrim { position: absolute; inset: 0; background: radial-gradient(circle at var(--px, 50%) var(--py, 50%), rgba(4,14,19,.05) 0, rgba(4,14,19,.3) 260px); animation: fadeIn .18s ease-out; }
.pie-wrap { position: absolute; left: 0; top: 0; width: 0; height: 0; }
.pie-center {
  position: absolute; left: -36px; top: -36px; width: 72px; height: 72px; border-radius: 50%; border: 3px solid var(--accent); padding: 0;
  background: var(--panel-solid); box-shadow: var(--shadow); animation: pieGrow .2s ease-out; overflow: hidden;
}
.pie-center canvas { width: 100%; height: 100%; display: block; }
.pie-center.back::after { content: '↩'; position: absolute; inset: 0; display: grid; place-items: center; background: rgba(7, 24, 31, .65); font-size: 24px; font-weight: 800; color: var(--accent); }
.pie-title { position: absolute; left: 0; top: 44px; transform: translateX(-50%); white-space: nowrap; font-size: 12px; font-weight: 800; padding: 2px 9px; border-radius: 999px; background: rgba(7, 24, 31, .85); color: var(--ink-dim); pointer-events: none; }
.pie-item {
  position: absolute; display: flex; align-items: center; gap: 7px; padding: 7px 12px 7px 8px; border-radius: 999px;
  background: var(--panel-solid); border: 1px solid var(--line-strong); font-weight: 800; font-size: 13px; color: var(--ink);
  white-space: nowrap; max-width: 260px; box-shadow: var(--shadow-sm); animation: pieItemIn .22s ease-out backwards;
}
.pie-item .emoji { font-size: 17px; width: 22px; text-align: center; flex: none; }
.pie-item .p-label-wrap { display: flex; flex-direction: column; min-width: 0; text-align: left; }
.pie-item .p-label { overflow: hidden; text-overflow: ellipsis; }
.pie-item .p-why { display: block; font-size: 10.5px; font-weight: 700; color: var(--ink-faint); white-space: normal; max-width: 200px; line-height: 1.2; }
.pie-item.has-why { border-radius: 16px; align-items: flex-start; }
.pie-item:hover:not([aria-disabled="true"]), .pie-item:focus-visible { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pie-item[aria-disabled="true"] { opacity: .55; cursor: not-allowed; background: rgba(14, 43, 55, .92); }
.pie-item[aria-disabled="true"] .p-label { color: var(--ink-dim); }
/* category items (phone submenus) already end their label with an ellipsis */
@keyframes pieGrow { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pieItemIn { from { opacity: 0; translate: var(--dx0, 0) var(--dy0, 0); } to { opacity: 1; translate: 0 0; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* -------------------------------------------------------------- modals */
#modal-root { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: calc(16px + var(--sat)) 16px calc(16px + var(--sab)); background: var(--scrim); animation: fadeIn .18s ease-out; }
.modal { width: min(560px, 100%); max-height: 100%; display: flex; flex-direction: column; overflow: hidden; background: var(--panel-solid); }
.modal.wide { width: min(880px, 100%); }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px 10px; }
.modal-head h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1.1; text-wrap: balance; }
.modal-body { padding: 4px 18px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.opt-section { display: flex; flex-direction: column; gap: 8px; }
.opt-section h3 { margin: 0; font-size: 12px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: var(--ink-faint); }
.opt-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 12px; border-radius: 12px; background: rgba(255,255,255,.04); }
.opt-row .o-text { display: flex; flex-direction: column; min-width: 0; }
.opt-row .o-text b { font-size: 14px; }
.opt-row .o-text span { font-size: 12px; color: var(--ink-dim); }
.opt-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.switch { position: relative; width: 46px; height: 26px; flex: none; border-radius: 999px; border: 1px solid var(--line-strong); background: rgba(0,0,0,.3); padding: 0; transition: background .15s; }
.switch::after { content: ''; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--ink-dim); transition: transform .18s, background .18s; }
.switch[aria-checked="true"] { background: var(--good); border-color: var(--good); }
.switch[aria-checked="true"]::after { transform: translateX(20px); background: #fff; }
.seg { display: inline-flex; background: rgba(0,0,0,.25); padding: 3px; border-radius: 11px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; color: var(--ink-dim); font-weight: 800; font-size: 12px; padding: 6px 10px; border-radius: 8px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel-solid); }
.slot-list { display: grid; gap: 8px; }
.slot { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.04); border: 1px solid var(--line); }
.slot.current { border-color: rgba(247, 197, 72, .5); }
.slot .sl-name { font-weight: 800; font-size: 14px; }
.slot .sl-meta { font-size: 12px; color: var(--ink-dim); }
.slot .sl-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
textarea.code { width: 100%; min-height: 160px; resize: vertical; border-radius: 12px; border: 1px solid var(--line-strong); background: rgba(0,0,0,.3); padding: 10px; font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 11.5px; color: var(--ink); box-sizing: border-box; }
.form-error { color: #ffbfb2; font-size: 12.5px; font-weight: 700; min-height: 1em; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; font-weight: 800; color: var(--ink-dim); }
.field input[type="text"] { height: 38px; border-radius: 10px; border: 1px solid var(--line-strong); background: rgba(0,0,0,.28); padding: 0 12px; font-weight: 700; box-sizing: border-box; width: 100%; }
.field input[type="text"]:focus { border-color: var(--accent); outline: none; }
input[type="file"] { font-size: 12.5px; max-width: 100%; }

/* create a family */
.members { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
.member { border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: rgba(255,255,255,.03); min-width: 0; }
.member-top { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: center; }
.member-top canvas { width: 64px; height: 64px; border-radius: 50%; background: var(--panel-raised); display: block; }
.member-tools { display: flex; gap: 6px; flex-wrap: wrap; }
.color-row { display: grid; grid-template-columns: 58px 1fr; gap: 6px; align-items: center; }
.color-row > span { font-size: 11px; font-weight: 800; color: var(--ink-faint); }
.swatch-row { display: flex; flex-wrap: wrap; gap: 4px; }
.cswatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(0,0,0,.35); padding: 0; }
.cswatch[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
.traits { display: grid; gap: 6px; }
.trait-slider { display: grid; grid-template-columns: 92px 1fr 24px; gap: 8px; align-items: center; font-size: 12px; font-weight: 700; }
.trait-slider input { width: 100%; accent-color: var(--accent); }
.trait-slider output { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
.points { font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: rgba(247, 197, 72, .14); color: var(--accent); align-self: flex-start; }
.points.zero { background: rgba(100, 207, 116, .14); color: var(--good); }
.lot-choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.lot-card { text-align: left; border-radius: 16px; border: 2px solid var(--line); background: var(--panel-raised); padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.lot-card:hover { border-color: var(--line-strong); }
.lot-card[aria-pressed="true"] { border-color: var(--accent); }
.lot-card .lc-ico { font-size: 34px; }
.lot-card b { font-family: var(--font-display); font-size: 18px; }
.lot-card span { font-size: 12.5px; color: var(--ink-dim); }
.lot-card .lc-money { font-family: var(--font-display); font-weight: 800; color: var(--money); font-size: 17px; }
.warn-note { font-size: 12.5px; color: var(--ink-dim); background: rgba(242, 179, 61, .1); border: 1px solid rgba(242, 179, 61, .35); padding: 8px 12px; border-radius: 12px; }

/* help card */
#help-card { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, calc(100vw - 32px)); max-height: calc(100% - 32px); overflow-y: auto; z-index: 45; padding: 18px 20px; background: var(--panel-solid); }
#help-card h2 { margin: 0 0 4px; font-family: var(--font-display); font-weight: 800; font-size: 26px; }
#help-card .lead { margin: 0 0 12px; color: var(--ink-dim); }
.help-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; margin-bottom: 14px; }
.help-grid div { display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; }
.help-grid b { font-size: 13px; }
.help-grid span { color: var(--ink-dim); }

/* ------------------------------------------------------- boot + fatal */
#boot { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; background: radial-gradient(110% 80% at 50% 40%, #16404c 0%, var(--bg) 72%); transition: opacity .45s; }
#boot.is-done { opacity: 0; pointer-events: none; }
.boot-inner { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 24px; text-align: center; }
.boot-logo { position: relative; width: 86px; height: 70px; }
.boot-logo .roof { position: absolute; left: 3px; top: 0; width: 0; height: 0; border-left: 40px solid transparent; border-right: 40px solid transparent; border-bottom: 32px solid var(--accent); }
.boot-logo .house { position: absolute; left: 13px; top: 30px; width: 60px; height: 40px; background: #e9efe9; border-radius: 0 0 6px 6px; }
.boot-logo .door { position: absolute; left: 36px; top: 46px; width: 14px; height: 24px; background: #1f5262; border-radius: 7px 7px 0 0; }
.boot-logo .win { position: absolute; left: 19px; top: 40px; width: 12px; height: 12px; background: var(--accent); border-radius: 2px; box-shadow: 36px 0 0 var(--accent); }
.boot-title { font-family: var(--font-display); font-weight: 800; font-size: 46px; line-height: 1; letter-spacing: .5px; }
.boot-tag { color: var(--ink-dim); font-weight: 600; margin-top: -6px; }
.boot-bar { width: 180px; height: 6px; border-radius: 6px; background: rgba(255,255,255,.1); overflow: hidden; }
.boot-bar i { display: block; width: 40%; height: 100%; border-radius: 6px; background: var(--accent); animation: bootSlide 1.2s ease-in-out infinite; }
@keyframes bootSlide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
#boot-text { font-size: 13px; color: var(--ink-dim); font-weight: 700; min-height: 1.3em; }
#fatal { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 16px; background: var(--bg); }
.fatal-card { width: min(520px, 100%); padding: 22px; background: var(--panel-solid); display: flex; flex-direction: column; gap: 12px; }
.fatal-card h1 { margin: 0; font-family: var(--font-display); font-size: 28px; line-height: 1.1; }
.fatal-card p { margin: 0; color: var(--ink-dim); }
.fatal-card details { font-size: 12px; color: var(--ink-faint); }
.fatal-card pre { white-space: pre-wrap; word-break: break-word; max-height: 180px; overflow: auto; background: rgba(0,0,0,.3); padding: 10px; border-radius: 10px; margin: 8px 0 0; }
.fatal-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ------------------------------------------------ mid widths (tablets) */
@media (max-width: 1100px) and (min-width: 761px) {
  .clock-face { display: none; }
  .mode-btn { padding: 0 11px; font-size: 15px; }
  #bar { gap: 10px; }
}
@media (max-width: 960px) and (min-width: 761px) {
  .mode-btn .m-label { display: none; }
  .mode-btn { padding: 0 13px; }
  .mode-btn .emoji { font-size: 20px; }
  #dock { width: 340px; }
}

/* ------------------------------------------------------- phone layout */
@media (max-width: 760px) {
  :root { --gap: 8px; --bar-h: 122px; --drawer-w: 100vw; }
  #bar { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "time money" "modes modes"; row-gap: 6px; column-gap: 8px; padding: 8px; border-radius: 16px; }
  .timebox { grid-area: time; gap: 8px; min-width: 0; }
  .moneybox { grid-area: money; min-width: 0; }
  .modes { grid-area: modes; justify-content: space-between; }
  .mode-btn { flex: 1 1 0; justify-content: center; height: 44px; padding: 0 4px; font-size: 14px; gap: 5px; min-width: 0; }
  .clock-face { display: none; }
  .clock-time { font-size: 21px; }
  .speed-btn { width: 36px; height: 36px; }
  .moneybox .money { font-size: 20px; }
  .money-family { max-width: 120px; }
  #dock { left: var(--gap); right: var(--gap); width: auto; }
  .dock-row { display: flex; gap: 8px; align-items: flex-end; justify-content: space-between; order: 3; }
